services:
  api:
    build: .
    image: smartcampus:1.0
    ports:
      - "8081:8080"
    environment:
      PORT: "8080"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: smartcampus
      DB_USER: campus
      DB_PASSWORD: campuspass
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smartcampus
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: campuspass
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus -d smartcampus"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
